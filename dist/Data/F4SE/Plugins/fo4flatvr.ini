[Beam]
; The pointer beam: a visible laser from the pointing controller (right; left with bLeftHanded=1) to what it points at,
; with an end dot where it hits. Drawn as OpenXR layers (both eyes, at its real place), over the menu it ends on.
; Like FO4VR's wand laser it shows in workshop mode and while commanding a companion (ray to the first thing hit, up to
; fMaxLengthM). It also shows on everything the pointer works on: menus on the flat window and menu panels, the dialogue
; panel, terminals on their monitor, and the Pip-Boy screen (only while the ray is on it). 0 = no beam anywhere.
bBeam=1
; End dot at the hit point. It replaces the dots drawn into the menu / Pip-Boy image ([Menus] / [Pipboy] bCursorDot);
; 0 = no end dot (those dots come back).
bDot=1
; Colour and opacity (0..1). FO4VR's laser: cyan 0 / 1 / 1, opaque.
fColorR=0.0
fColorG=1.0
fColorB=1.0
fAlpha=1.0
; Beam width (FO4VR: 0.7 cm), length when nothing is hit (FO4VR: 17.1 m), start ahead of the controller.
fWidthCm=0.7
fMaxLengthM=17.1
fStartCm=1.0
; End dot size as seen from the hand (degrees, so it reads the same near and far) and its smallest size.
fDotSizeDeg=0.8
fDotMinCm=0.5
; Per pointer: menus (flat window, panels, dialogue panel, terminals), the Pip-Boy screen, workshop mode + commanding
; a companion (FO4VR's laser).
bMenus=1
bPipboy=1
bWorkshop=1
; 1 = FO4VR's activation preview (its bShowWandActivationPreview, off by default there too) whenever you are in the
; world: a cone from the right hand, fading in toward its tip (white; green when what you point at can be activated)
; and a glow marker at its end, out to ~1.4 m (longer pointing down at the floor), shorter at a wall. Like FO4VR the cone
; fades out after fActivateFadeStartS + fActivateFadeS seconds and comes back after any menu; the marker stays.
bActivate=0
fActivateReachM=1.371
fActivateFloorMult=1.5
fActivateFadeStartS=10.0
fActivateFadeS=10.0
; end marker size; 0 = none (bDot=0 also hides it)
fActivateMarkerCm=18.8
; 1 = the Pip-Boy colour instead of white/green (FO4VR bWandTrajetoryUsePipboyColor)
bActivatePipboyColor=0

[Performance]
; Performance pass, 26 Nov (PERF-PASS.md). All four are live (also on the MCM page Render > Performance).
; High FPS Physics Fix limits the game to its OutOfFocusFPS (60) whenever another window has the focus (SteamVR, Virtual
; Desktop, Discord, MO2 ...), and the headset then gets 60 fps. 1 = the game window does not report losing focus while the
; VR session runs, so that limit never starts. 0 = as before.
bKeepFocusFrameRate=1
; Only with [General] iGpuQueueFrames=0: while frames miss the display period, 1 frame may stay queued on the GPU (the
; shipped default behaviour) until CPU work + GPU tail fit the period again. HIGH IMPACT: changes head-pose timing while
; relaxed. 0 = always wait (lowest latency, lower frame rate in heavy scenes).
bGpuQueueAdaptive=1
; Each eye's region of the frame is copied straight into the headset's swapchain image (1 copy; was a split copy, a stage
; copy and a shader blit per eye). 0 = the previous path.
bDirectEyeCopy=1
; The desktop game window is only a mirror: present it every Nth frame (1 = every frame).
iMirrorEvery=1
