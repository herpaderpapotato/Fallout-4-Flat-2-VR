; fo4flatvr - flat Fallout 4 1.11.240 to OpenXR (feasibility build)
; Log: Documents\My Games\Fallout4\F4SE\fo4flatvr.log

[General]
bEnabled=1
; Phase 1: headset pose drives the first-person camera.
bHeadTracking=1
bPositionTracking=1
; 1 = game world fills the headset (mono, head-tracked) in first person.
; 0 = flat cinema screen. Any non-first-person camera (third person, VATS, game dialogue camera,
; furniture) and scoped aiming always fall back to the cinema screen (see [Camera]).
bMono=1
; 1 = alternate-eye stereo (left eye on even frames, right on odd). Bring-up/diagnostic mode: each
; eye updates at half the game's frame rate and the eyes show different moments, so moving things
; and stick locomotion look wobbly in depth; temporal effects (TAA, motion blur) will ghost.
bAFR=0
; Game units per real metre for head position (Bethesda scale is ~70). Live (20 Nov): head, hands, roomscale, stereo eyes,
; FRIK-flat and the scene views take a change at the next frame.
fUnitsPerMeter=70.0
; 20 Nov: 1 = the game's default scale everywhere, nothing of ours scaling the body, skeleton, player or world: FRIK-flat's
; skeleton at root scale 1 (FRIK.toml PlayerHeight, the C36 calibrated body height and the armLength bone scaling are not
; used; the skeleton is rebuilt when this changes) and 70 units per metre whatever fUnitsPerMeter says (the head, hands and
; roomscale). Both parts are live. 0 = our scaling (default).
bNoScaling=0
; Head-tracking jitter fix: while the game runs, its camera update runs on a job thread at the same time as
; the frame hand-off, and used the previous frame's head pose while the headset was told the new one (one
; frame of head motion as jitter/flicker). 1 = the camera update waits (at most fPoseSyncTimeoutMs) until
; the new pose is published, so camera, stereo eyes and submitted layer always use the same pose.
bPoseSync=1
fPoseSyncTimeoutMs=50
; 20 Nov: GPU frame queue. When the GPU is the bottleneck (neural rendering, a ReShade DLSS tool, a high render size) the
; CPU otherwise runs up to 3 frames ahead of the GPU and every frame is drawn with a head pose predicted for a display time
; the GPU only reaches 1-3 frames later (laggy / unstable head). 1 = before the next head pose is predicted, wait until at
; most iGpuQueueFrames frames are still unfinished on the GPU (no wait when the GPU keeps up). 0 = off. Live.
bGpuQueueLimit=1
; 1 = one frame may still be on the GPU (keeps the GPU busy, default); 0 = wait for all of it (lowest latency, lower frame
; rate when GPU-bound); 2 = two frames. Live.
iGpuQueueFrames=1
; Our changes to game state (camera switches, equip, console commands, workshop, HUD messages), menus (pointer clicks,
; HUD widget fixes) and the scene graph (dialogue weapon / POV head hiding) run on the game's main thread once per frame,
; where the engine runs console commands (after the job threads and the menus finished, before the frame is drawn).
; 0 = F4SE's task queue, which runs them on whichever thread empties it (job threads too), and those polls at Present,
; as before 20 Nov. Live (the hook stays installed and passes through). (analysis/threading.md)
bMainThreadQueue=1

[Debug]
; 1 = record every head-pose publish/read/write (thread, timestamp, value) and write CSVs
; Documents\My Games\Fallout4\F4SE\fo4flatvr_posetrace_NNN.csv (iPoseTraceFrames frames each, at most
; iPoseTraceFiles files). Analyse with plugin/tools/htrace_analyze.py. Small CPU cost; off for play.
bPoseTrace=0
iPoseTraceFrames=3000
iPoseTraceFiles=20

[Render]
; Swapchain/render resolution, independent of the game window (the window shows a scaled mirror).
; 0 = the game's own size (window). The mono view covers ~137 x 110 deg on a Quest 3 via Virtual
; Desktop, so it needs far more pixels than a desktop window; 2880x1620 is a middle ground.
iWidth=2880
iHeight=1620
; Multiplies the per-eye size (iWidth/2 x iHeight; mono: iWidth x iHeight), like FO4VR's fRenderTargetSizeMultiplier.
; 1.0 = as above, 0.8 = 64 % of the pixels, 1.2 = 144 %. Range 0.25..4.
; [Render] needs a restart: the game sizes its whole render-target set from the swapchain once, when its renderer starts.
fRenderScale=1.0

[Window]
; The desktop window is only a mirror. Forced to a normal window of this client size whatever
; Fallout4Prefs.ini says (iSize / borderless / fullscreen). 0 = the game's own.
; Live (20 Nov): a change resizes the window at once (the render size is not affected).
iWidth=1280
iHeight=720

[OpenXR]
; Leave empty to use the system's active OpenXR runtime. Examples:
;   E:\SteamLibrary\steamapps\common\SteamVR\steamxr_win64.json
;   C:\Program Files\Virtual Desktop Streamer\OpenXR\virtualdesktop-openxr.json
;   C:\Program Files\Oculus\Support\oculus-runtime\oculus_openxr_64.json
sRuntimeJson=
bPreferStageSpace=0

[Cinema]
fWidthMeters=3.0
fDistanceMeters=2.5
fHeightMeters=0.0

[Keys]
; Windows virtual-key codes (113 = F2, 114 = F3, 119 = F8, 121 = F10). Keyboard only, while the game window has focus.
; Chosen free of Fallout 4's own keys (F5 quicksave, F9 quickload; F1/F4/F6/F12 in debug/menu contexts), Steam (F12),
; AAF (Home, Delete, End, PageUp/Down, F11), OCBP/LPCE (F7), SAM (;) and the MCM keybinds in use. 0 = key off.
; Recenter the view (was F9 = quickload until 16 Nov).
iRecenter=119
; Pause/resume sending frames to the headset.
iToggle=121
; Cycle the view mode of the camera you are in now: SCENE -> TRACK -> CINEMA (flat window) -> SCENE (first person:
; TRACK <-> CINEMA). For testing; not saved. A HUD message says the new mode. Pipe: camdir cycle.
iCameraCycle=113
; First <-> third person (the engine's Force1stPerson / Force3rdPerson; works when a mod like AAF has disabled the
; game's own POV switch) - the way out if you get stuck in third person. Pipe: camdir pov.
iPovToggle=114
; 20 Nov: the VR settings panel (plugin ConfigUI.h): iConfigMenu with the modifier iConfigMenuMod (0 none, 1 Shift, 2 Ctrl,
; 3 Alt) opens / closes it. Default Ctrl+F2 (F2 alone stays the camera view cycle).
iConfigMenu=113
iConfigMenuMod=2

[Controllers]
; 1 = the weapon fires from the aim-hand controller and along its pointing direction, and the
; "Activate" / pickup target is whatever that controller points at (instead of the screen centre).
; Player shots only; VATS keeps the game's own aim, grenades and mines see bAimThrowsWithController. Needs OpenXR
; controllers; without a fresh controller pose (or in third person / VATS / menus) the game's camera aim is used.
; 0 = the game's own aim (the hooks are then not installed at all).
bAimWithController=1
; 1 = grenade and mine throws leave along the aim-hand controller's pointing direction, pitch included, so they arc
; where you point (the game's throw point, projectile speed and gravity are unchanged; no throw-velocity physics, as in
; FO4VR). The perk grenade-trajectory arc follows the controller too. Needs bAimWithController=1. 0 = the game's own
; throw direction (actor facing + look pitch). Pipe: aim throw on|off.
bAimThrowsWithController=1
; 1 = a V.A.T.S. playback shot whose origin came out in the first-person rig's player-relative space (near the world
; origin: the game added no first-person offset, e.g. the VATS camera after a view switch that did not complete) starts at
; the real muzzle (+ the player's position) and the game re-aims it at the queued body part (VATS::SetProjectileLaunchData,
; the game's own hit / miss roll). Logged as "vats shot #n". VATS keeps the game's aim either way (no hand ray), also for
; the hit-chance prediction. 0 = the origin as the game computed it. Live; pipe: aim vatsshot on|off.
bVatsShotFix=1
; 1 = Fallout 4 VR's default controller bindings per context (gameplay, Pip-Boy, favorites, VATS, workshop, lockpicking,
; dialogue, menus; analysis/vr-controls.md, plugin README "Controller bindings"); 0 = the old generic Xbox layout.
bFO4VRBindings=1
; 1 = in a conversation the face buttons pick the option the menu labels with them (A bottom, B right, X left, Y top,
; as on the flat gamepad); the grip no longer sends B there. 0 = the earlier mapping (A or X -> A, grip -> B).
bDialogueFaceButtons=1
; Extended Dialogue Interface (XDI.dll) only: 1 = lists that are not the four standard responses (more than 4 rows,
; options added by other mods) scroll with the aiming hand's stick (one row per push, repeats while held; left/right
; changes value options), A or the trigger (when not pointing at the menu) picks the highlighted option, and pointing at
; an option + trigger picks that one. The four standard responses follow [Dialogue] bStickResponses. 0 = off.
bDialogueListNav=1
; 1 = while the HUD quick-container list of a container you point at is up (FO4VR quick menu), that hand's stick
; up/down steps through the list (repeats when held) instead of jumping / sneaking / walking; A or X takes the selected
; item, B opens the transfer menu (take all there with X). 0 = off (D-pad only).
bQuickLootStick=1
; 1 = workshop mode as Fallout 4 VR: hold Y (the game's fEnterWorkshopDelay, 1.5 s) in a build area enters it (through
; the engine; before, a pad Back press too short for the game toggled first / third person), Y leaves it, X minimises the
; build menu (panel hidden, the left stick walks) and shows it again, the left stick steps the menu while it is shown
; (left/right category, up = into the entry, down = back), left stick click held = settlement stats (panel enlarged),
; right trigger build / select / place, A scrap, B store, right grip wire (cancel while moving an object), right stick
; left/right rotates and up/down pushes / pulls a held object, right stick click held still = tag for search / supply
; line. 0 = the earlier workshop mapping (and hold Y = pad Back after 0.6 s).
bWorkshopFO4VR=1
; 1 = right stick up pushes a held workshop object away, down pulls it closer; 0 = the reverse.
bWorkshopStickUpFarther=1
; FO4VR quick menu (28 Nov): the right stick click opens the favourites menu (with right-hand gestures on, hold the click
; still for [Gestures] fButtonDelayS, as sprint) as FO4VR's 12-entry ring on the right hand (its world_Favorites.swf, installed
; by plugin/tools/install_vr_favorites.py; without it the flat list): the stick direction highlights an entry (haptic tick),
; releasing the trigger uses it, the right grip puts away / draws the weapon with the menu open (hint "PUT AWAY WEAPON" /
; "DRAW WEAPON"), the left grip, B or another click close it. Left-handed: mirrored. 0 = no quick menu (right stick click +
; right grip in gameplay still holsters). Live. Pipe: bindings quickmenu [holster|tree|vars].
bQuickMenu=1
; 1 = a stick held while leaving VATS, a menu, the Pip-Boy, a conversation or quick loot moves / turns at once (FO4VR /
; flat: the gamepad sends the held stick every frame, so the new context gets it on its first frame); snap turn fires at
; once too. 0 = before 28 Nov: the stick does nothing until it comes back to the centre. Live.
bStickCarryOver=1
; Pip-Boy page buttons (27 Nov; the flat Pip-Boy pages' own pad buttons, FO4VR puts them on the left stick click):
; left stick click = EFFECTS on the STAT page (FO4VR) / SORT, COMPONENT VIEW in the inventory; right A = Radaway / drop /
; show on map / world-local map; right B = EFFECTS / favourite / next perk; right grip = cycle damage / quest summary /
; caravans / previous perk; right stick click = inspect (held fButtonDelayS while right gestures are on). The left grip
; closes the Pip-Boy (left-handed: mirrored). In STAT > PERKS the left stick click does nothing (FO4VR). A Pip-Boy shown
; on the flat window (direct open refused) gets the same mapping. 0 = as before: both grips close, those buttons do
; nothing, the flat-window Pip-Boy uses the generic menu mapping. Live.
; Pipe: bindings pipboy.
bPipboyPageButtons=1
; 28 Nov: LooksMenu (face / body sculpt) like FO4VR (VR LooksMenu button handler 140B60B70): A = FACE / sculpt the
; highlighted feature, the pointer's trigger = the mouse button (pick, drag to sculpt), left trigger = SEX (WandTrigger),
; a grip = ConfirmCloseMenu (WandGrip), B = back, Y = done. 0 = the generic menu layout (A sent pad Y = SEX).
bLooksMenuFO4VR=1
; 1 = in workshop mode the highlight of existing objects and the placed / moved object follow the aim hand's
;     pointer (FO4VR: the wand ray; raise / lower the hand to change the height, the right stick pushes / pulls along it).
;     0 = the camera ray (flat game). Live.
bWorkshopHandPointer=1
; 1 = holding the left grip (FO4VR's Pip-Boy light binding) toggles the Pip-Boy light through the engine's own
; TogglePipboyLight (the light sound plays; log line "pipboy light: ..."). 0 = a 1.2 s pad B hold (the game's Pip-Boy
; button held = light). The left trigger opens the Pip-Boy with a short B tap (held, it no longer toggles the light).
; Pipe: bindings light [toggle].
bPipboyLightDirect=1
; Crosshair focus tick ("UIItemFocus", played by the game whenever the activate pick changes to a new object). The hand
; ray / head-tracked view moves every frame, so the pick flickers between neighbouring objects and the tick repeated
; constantly. 1 = an object ticks only when it was not under the pick in the last fPickFocusSoundRepeatS seconds;
; 0 = no focus tick (as FO4VR); 2 = the game's tick on every pick change. Live. Pipe: bindings sounds.
iPickFocusSound=0
fPickFocusSoundRepeatS=1.5
; Sound diagnostic (ticking report): 1 = every game sound start is counted (BSAudioManager), with log lines
; "engine sound: '<name>' ..." for the first two starts of each sound, a sound that repeats (5 starts within 10 s),
; one that stacks (more copies playing at once than before) or a single copy playing over 10 s, each with the code that
; made and started it. Pass-through only. 0 = not installed. Restart. Pipe: bindings sounds.
bSoundDiag=1
; 1 = the button glyphs the game shows (menu button bars, HUD prompts like "Hold [Y] ...", "[Activate]"-style tokens
; in messages and tutorials) name the Touch control that does that action under these bindings: A/B/X/Y keep their
; letters, trigger = RT/LT glyph, grip = RB/LB, stick = LS/RS, stick click = L3/R3 (left-handed: mirrored). 0 = the
; flat game's Xbox glyphs. Pipe: bindings glyphs.
bGlyphRemap=1
; 1 = aim with the left controller instead of the right.
bLeftHanded=0
; 1 = the weapon-lowering ("gun blocked") and cover iron-sight tests use the controller ray instead
; of the head: the gun is lowered when the controller points into a wall, not when the head faces one.
bHandLineOfFire=1
; 1 = weapon recoil no longer turns the view (the game kicks the player's aim angles, i.e. the camera,
; while a controller aim ray is live). Spread / cone growth per shot is unchanged.
bSuppressCameraRecoil=1
; 1 = the activation target is what the controller points at even if the game's screen-centre
; auto-aim picked an actor (e.g. a companion the head looks at); a companion the controller points at
; is the target even outside the head's command cone.
bHandAutoAimOverride=1
; 1 = the controller ray starts no further than the first wall between the eyes and the hand, so shots
; and pickups cannot start inside / behind geometry when the hand is pushed through a wall.
bClampHandToCamera=1


[HUD]
; 1 = in the head-tracked world view the game HUD (compass, health, ammo, ...) leaves the world image
; and is shown on its own head-locked layer in front of the eyes; menus / third person / cinema keep
; the HUD in the picture as before. 0 = the game's own HUD in the image (the hooks are then not
; installed at all).
bSeparateHud=1
; Distance (m) of the HUD plane ahead of the eyes, its width (m; height follows the render aspect),
; and its centre's offset from eye level (m; negative = below).
fDistanceMeters=1.2
fWidthMeters=1.0
fHeightMeters=-0.25
; 1 = hide the screen-centre crosshair while the HUD is on its own layer (it no longer marks the aim).
bHideCrosshair=1
; Advanced: engine render target shown on the layer (62 = 0x3E, HUD after the glass effect, clean
; premultiplied alpha; 63 = 0x3F, raw movie, has colour where alpha is 0) and its alpha mode.
iSourceTarget=62
bPremultiplied=1
; 1 = HUD elements that go away (pickup text, HIDDEN / CAUTION) leave the HUD layer at once instead of lingering.
bClearTargets=1
; HUDFramework (Sim Settlements, MSMA HUD, ...) only: 1 = its widget container is checked once a second to map to the
; HUD's 1280x720 layout and corrected if not; the widget layout is written to the log ("hudfw:") either way. 0 = no
; correction (log only).
bHudFrameworkFix=1
; ---- FO4VR HUD placement (20 Nov). FO4VR splits the HUD: health / rads / AP / ammo on the right controller (its
; WSPrimaryWandHUD), the compass low under the chin (WSHMDHUDStatus), notifications / subtitles on a lagging head panel.
; 1 = health, rads, AP, ammo, explosives, effects and fatigue are shown on a panel beside the aim hand (right; left with
; [Controllers] bLeftHanded=1) instead of the head-locked HUD. Live (VR settings panel / MCM). 0 = on the head-locked HUD.
bHandHud=1
; Hand panel width (m) and its centre in the aim pose (m: X right, mirrored for the left hand, Y up, Z back toward you;
; FO4VR: 8.6 cm inward of the controller) and an extra tilt (degrees, + = top toward you).
fHandHudWidthM=0.13
fHandHudX=-0.09
fHandHudY=-0.02
fHandHudZ=0.0
fHandHudPitchDeg=0.0
; 1 = the compass is on FO4VR's chin panel (follows the head's heading, not its pitch: look down to read it).
; 0 = it stays on the head-locked HUD (still shown / hidden by iCompassShow).
bCompassChin=1
; Chin panel: distance ahead (m), height below the eyes (m, negative) and width (m). FO4VR: 0.32 ahead, 0.55 below, 0.6 wide.
fCompassDistanceM=0.32
fCompassHeightM=-0.55
fCompassWidthM=0.55
; When the compass shows: 0 = always (FO4VR), 1 = never, 2 = while a hand is raised but not high (default),
; 3 = while a palm is turned up (VRIK's "Show Compass: When Left/Right Palm Up"). It slides in and out like VRIK's.
iCompassShow=2
; Which hand counts: 0 = either, 1 = left, 2 = right.
iCompassHand=0
; Mode 2: the hand (controller grip) between fCompassRaiseHighM and fCompassRaiseLowM below the eyes (m).
fCompassRaiseLowM=0.45
fCompassRaiseHighM=0.05
; Mode 3: palm-up threshold (VRIK: 0.65 = within 49 degrees of straight up).
fCompassPalmUpDot=0.65
; Slide (VRIK): distance (m; VRIK 50 units) and rate (VRIK 10; about 0.4 s each way).
fCompassSlideM=0.714
fCompassSlideRate=10.0
; Advanced: the HUDMenu clips of each part (comma lists, paths under root1), for HUD replacers with other clip names.
sHandHudLeftClips=LeftMeters_mc.HPMeter_mc,LeftMeters_mc.RadsMeter_mc
sHandHudRightClips=RightMeters_mc.ActionPointMeter_mc,RightMeters_mc.AmmoCount_mc,RightMeters_mc.ExplosiveAmmoCount_mc,RightMeters_mc.HUDActiveEffectsWidget_mc,RightMeters_mc.FatigueWarning_mc
sCompassClips=BottomCenterGroup_mc.CompassWidget_mc.CompassBGHolder_mc,BottomCenterGroup_mc.CompassWidget_mc.QuestMask_mc

[Pipboy]
; 1 = wrist Pip-Boy in the head-tracked world view: the Pip-Boy opens directly (no arm-raise animation,
; no camera move), its screen is a quad attached to the left controller (right with bLeftHanded=1 in
; [Controllers]) and the world view stays on. Point the other controller at the screen: the trigger
; clicks, the thumbstick (up/down) scrolls; the pad buttons keep working (B closes, bumpers/triggers
; page/tab when not pointing at the screen). Holotape games and holotape terminals show on the Pip-Boy screen;
; third person keeps the flat-screen fallback; power armour: see [PowerArmor] bProjectedPipboy.
; 0 = FO4VR's projected Pip-Boy in front of you (bProjected below), or the game's own Pip-Boy with bProjected=0.
bWristPipboy=1
; Screen width (m; height follows the Pip-Boy screen aspect).
fWidthMeters=0.20
; Screen centre in the Pip-Boy hand's grip space (m), given for the left hand and mirrored for the right:
; X negative = out of the back of the hand, Z positive = toward the elbow, Y = along the thumb side.
fOffsetX=-0.05
fOffsetY=0.0
fOffsetZ=0.13
; Extra rotation (degrees) about the screen's own axes (X tilts the top toward/away from you, Y turns
; it, Z spins it in its plane); applied Y, then X, then Z.
fRotXDeg=0
fRotYDeg=0
fRotZDeg=0
; Advanced: source render target (61 = 0x3D, the Pip-Boy movie as drawn - measured to be the only one
; written for the wrist Pip-Boy; 60 = 0x3C, falls back to 0x3D while it is never written), stop the
; Pip-Boy image-space modifier on a wrist open (keeps the world unfiltered), and draw the pointer
; position as a dot on the screen.
iSourceTarget=61
bStopImod=1
bCursorDot=1
; 1 = tint the wrist screen like the game does (brightness x your Pip-Boy colour from the game's
; Settings > Display, fPipboyEffectColorR/G/B in [Pipboy] of Fallout4Prefs.ini). 0 = the movie as drawn
; (grey/white).
bTint=1
; 1 = FO4VR's "projected" Pip-Boy: the screen floats in front of you (follows the head with a lag) instead of
; sitting on the wrist; same pointer and buttons. The game is paused while it is open (as with the wrist one).
; Placement: the fProjected* keys below (in power armour: [PowerArmor] fPipboy*).
bFloating=0
; With bWristPipboy=0: 1 = FO4VR's projected Pip-Boy (bAlwaysUseProjectedPipboy:VR) - the Pip-Boy screen in front of
; you, on FO4VR's geometry (its PADashPipboyScreen.nif screen on UprightHmdLagNode: 0.575 m wide, 0.65 m ahead,
; centre 0.07 m below the eyes), placed where you look; it stays put until you turn more than fProjectedLagConeDeg
; away, then it is dragged along (FO4VR fHmdRotationLagMaxDistance:VRUI = 45). Pointer, buttons and close as on the
; wrist. 0 = the game's own flat Pip-Boy (arm animation and zoom in the flat window).
bProjected=1
fProjectedWidthMeters=0.575
fProjectedDistanceMeters=0.65
fProjectedHeightMeters=-0.07
; 0 = follow the head smoothly with [PowerArmor] fPipboyFollowSeconds instead of the FO4VR lag cone.
fProjectedLagConeDeg=45
; 1 = no scanlines on the projected screen (FO4VR turns them off when projected). 0 = the game's scanlines.
bProjectedNoScanlines=1

[Menus]
; 1 = laser pointer for menus shown on the flat screen (pause/main menu, inventory/container/barter,
; terminals, message boxes, ...): point the right controller (left with bLeftHanded=1) at the screen,
; the trigger clicks, the thumbstick (up/down) scrolls. While the ray is on the screen that trigger does
; not reach the virtual pad; all pad buttons keep working (B = back). 0 = pad only.
bPointer=1
; Draw the pointer position as a dot on the screen.
bCursorDot=1
; 1 = the pointer also works on menus that hide their cursor while a controller is in use (conversations,
; Extended Dialogue Interface, mod menus); HUD and non-interactive overlays and V.A.T.S. never take it.
; 0 = only menus that show a cursor or take menu navigation.
bPointerAnyMenu=1
; 1 = mod menus that take input (Silhouette's picker, Screen Archer Menu, F4SE custom menus) appear on the menu panel
; in front of you with the pointer, like the pause menu. 0 = they are laid head-locked over the whole view (as VATS labels).
bPanelModMenus=1
; Extra menu names for that panel (comma list, e.g. a game menu a mod reuses), and names to keep off it.
sPanelMenus=
sNoPanelMenus=
; 1 = the menu pointer hits where its dot is drawn on menus the game letterboxes to 16:9 (main menu, pause menu, ...):
; mouse positions are given relative to the menu's own viewport. 0 = the old mapping (hits land right of the dot).
bPointerViewportFix=1
; 28 Nov: in LooksMenu the face-sculpt cursor (feature highlight) follows the pointer: each pointer move sets the game's
; menu cursor and runs LooksMenu's own mouse-move handler (FO4VR drives that cursor from the wand). 0 = stick only.
bLooksMenuPointerCursor=1
; 1 = a mod menu that fills the whole screen (Screen Archer Menu, ...) is laid out on the panel at the aspect of your
; flat display (Fallout4Prefs.ini iSize W/H, e.g. 3440x1440), so its edges are not cut off. 0 = the render buffer's aspect.
bModMenuFlatAspect=1
; Aspect for that (width / height, e.g. 2.389); 0 = from your Fallout4Prefs.ini iSize W/H.
fModMenuAspect=0
; 1 = the green glass shading behind menus and HUD panels lines up with them: the game's 16:9 glass mesh is stretched
; over the whole (wider) render buffer. 0 = the game's mesh as is (shading shifted / squeezed toward the centre).
bGlassFitScreen=1
; 1 = the render buffer is wider than 16:9 but narrower than the game's ultrawide (2:1), so the game letterboxes its menus
; without the ultrawide corrections: HUD floating markers and V.A.T.S. part labels are placed through the letterbox (the
; game's own ultrawide formula) and the fader covers the whole view. 0 = the game's 16:9 behaviour.
bAspectGapFix=1
; 1 = like FO4VR: the pause menu, the favourites menu and message boxes appear on a panel in front of you
; while the world stays live and head-tracked around it. 0 = they use the flat screen like other menus.
bPanel=1
; Source of the panel image: 62 = the menu renderer's final target (default), 63 = its raw movie target.
iPanelSource=62
; 1 = a menu / flat screen appears where you are looking when it opens and stays there (world-locked).
; 0 = always straight ahead of the last recentre (F9).
bAnchorToView=1
; Within one menu session a new menu moves the screen only if your head turned this far (degrees).
fReanchorDeg=50
; 1 = behind the flat screen (VATS, containers, terminals, console, ...) the last world frame stays visible,
; dimmed and fixed in the world, instead of black. Not at the main menu / loading screens.
bBackdrop=1
; Darkening of that backdrop (0 = none, 1 = black).
fBackdropDim=0.5
; 1 = the backdrop is a world panorama: everything you looked at in the head-tracked view is kept (as a cube
; around you, turned with your heading) and shown world-locked all around the flat window, so no direction is black.
; Never-seen directions are filled from their surroundings / the average colour, darker by fPanoramaHoleBrightness.
; 0 = the last world frame only (black outside what it showed).
bBackdropPanorama=1
fPanoramaHoleBrightness=0.6
; 1 = clear the menu renderer's shared targets after each menu draw, so a closed pause menu does not stay on the
; HUD as a ghost image. 0 = the game's behaviour.
bClearMenuTargets=1
; 1 = V.A.T.S. keeps the flat game's targeting / queue / playback, but over the live head-tracked world: the game's
; V.A.T.S. camera is not used and its overlay (targets, hit chances) is laid over your view. Turns on the
; [Camera] bGateVats / bVatsKeepCamera gates. 0 (default) = the flat V.A.T.S. image in a window, the world panorama
; around it (bBackdropPanorama). 1 moves/zooms the view (user, 15 Nov: nausea).
bVatsLiveWorld=0
; 1 = no flat V.A.T.S. image-space effect (tint + radial blur), in the window and in the live-world mode.
bVatsNoImod=1
; V.A.T.S. labels (hit chances) magnified this many times around the selected target, so they stay readable over
; the wide VR view. 1 = the flat size.
fVatsLabelScale=2
; 1 = no flat V.A.T.S. dark screen-edge vignette (window and live-world mode).
bVatsNoVignette=1
; 1 = V.A.T.S. camera window: the live head-tracked world stays around you and the V.A.T.S. window shows our own
; targeting camera (from your eye, zoomed onto the target) with the V.A.T.S. labels and highlight on it. Turns on the
; V.A.T.S. camera gates like bVatsLiveWorld (the V.A.T.S. camera's tilt of your view is undone). 0 = the flat V.A.T.S.
; image in the window + panorama (round 4).
bVatsCameraWindow=1
; Window camera: render every n-th frame; 0 = only the target (cheap), 1 = the whole scene (about 6.6 ms CPU +
; 4.4 ms GPU per render measured at 5632x2880); vertical FOV in degrees (0 = fit the target, x fVatsWindowFit);
; aim between the target's centre (0) and the selected body part (1).
iVatsWindowEvery=3
iVatsWindowScene=0
fVatsWindowFovDeg=0
fVatsWindowFit=1.6
fVatsWindowAimPart=0.35
; Window image: exposure of the tone map, fill light (albedo x this; the window view gets no sun), width in pixels,
; V.A.T.S. target highlight (mask) and its strength. iVatsWindowSun: 0 = no sun (default), 1/2 = experimental
; (1 crashed once).
fVatsWindowExposure=1
fVatsWindowAmbient=0.6
iVatsWindowWidth=2048
bVatsWindowMask=1
fVatsWindowMaskStrength=0.25
iVatsWindowSun=0
; 1 = containers, barter, crafting stations (cooking, chemistry, workbenches), power armour station, workshop,
; lockpicking and books also use the panel over the live world; their 3D item preview is shown on the panel.
; 0 = the flat screen with a frozen backdrop.
bPanelPreview=1
; 1 = like FO4VR: workbenches / crafting stations / chairs keep you in first person (no animated or third-person
; camera), so their menus can show the live world. Turns on the [Camera] bGateFurniture / bGateAnimated gates
; (not bBlockThirdPerson since 15 Nov); workbenches open their menu directly, no sit animation ([Camera] bWorkbenchDirectMenu=1).
; 0 = the game's cameras (the crafting view in the flat window with the panorama around it).
bCraftingLiveWorld=1
; 1 = in workshop mode the panel moves in front of you when you turn more than fReanchorDeg.
bFollowWorkshop=1
; Round 6, FO4VR workbenches (analysis/vr-workbenches.md). With bCraftingLiveWorld=1:
; 1 = crafting menus (cooking, chemistry, weapons/armour benches, power armour station) pause the game, as in FO4VR
;     (its WorkbenchMenuBase sets kPausesGame); the world stays head-tracked around the panel, frozen in time.
bWorkbenchPause=1
; 1 = crafting menus use FO4VR's workbench panel size and distance (world_projectedMenu.nif on UprightHmdLagNode:
;     about 0.68 m ahead, 1.21 m wide, centre 0.08 m below eye level), placed where you look when it opens.
; 0 = the [Cinema] size/distance like the other menus.
bWorkbenchPanelFO4VR=1
fWorkbenchWidthMeters=1.21
fWorkbenchDistanceMeters=0.68
fWorkbenchHeightMeters=-0.08
; 1 = workshop (build) mode shows its menu on the off-hand controller, as FO4VR (WS_InvWand.nif on the secondary
;     wand); point at it with the aim hand or use the sticks. 0 = the panel in front of you (bFollowWorkshop).
bWorkshopOnHand=1
; Hand panel placement in the off hand's FO4VR wand frame (the controller grip turned by [Weapon] fGripRotXDeg etc.,
; -60 = the pointing direction): width, offsets up / back (toward you) in metres, then the tilt about the wand's
; left-right axis (negative = face tilted up toward the eyes). Defaults = FO4VR's WS_InvWand.nif on the wand
; (-26.8 deg, face centre 0.4 cm down, 2.4 cm back).
fWorkshopHandWidthMeters=0.40
fWorkshopHandUpMeters=-0.004
fWorkshopHandBackMeters=0.024
fWorkshopHandPitchDeg=-26.8
; 1 = the hand panel shows the workshop menu's 16:9 stage (the bands outside it are cut) from fWorkshopCropTop down;
;     the whole menu image while the settlement stats are held (left stick click). 0 = always the whole menu image. Live.
bWorkshopHandCrop=1
; Where the shown area starts, as a fraction of the stage height from the top (0 = the whole menu: item info,
; requirements, category and item rows all need most of the height; 0.08 = without the settlement stats bar). Live.
fWorkshopCropTop=0
; Workshop (bWorkshopFO4VR): while the left stick click is held (settlement stats) the hand panel is this much larger.
fWorkshopStatsScale=1.75
; Round 7 (analysis/vr-terminals-pipboy.md). 1 = terminals like FO4VR: you stay in first person and the terminal shows
; on its own monitor in the live, head-tracked world (the game paused, as in FO4VR); point the aim controller at the
; monitor, the trigger clicks, the stick scrolls, A/B navigate and exit. Needs the first-person furniture gate
; (bCraftingLiveWorld=1); with the game's terminal camera it falls back to the flat window. 0 = the flat window with
; the panorama.
bTerminalInWorld=1
; 1 = every panel menu sits where FO4VR puts its world-space model: pause menu world_projected_MainPause.nif (1.48 m
; arc, 0.78 m ahead, centre 0.045 m below the eyes); containers, barter, lockpicking, wait, SPECIAL on
; world_projectedMenu.nif like the workbenches (fWorkbench*), level-up at twice that (fLevelUpMenuScale:VRUI = 2),
; books on world_projectedMenu_Flat.nif (1.0 m, 0.584 m), dialogue options at FO4VR's dialogue-band scale (world_Dialogue.nif:
; the whole movie 1.32 m wide at 0.55 m, see [MenuGeometry]). Favourites, message boxes and console keep the [Cinema]
; size (FO4VR draws them from its own VR-only movies). 0 = only the crafting menus (bWorkbenchPanelFO4VR).
; Any menu can be given its own size/distance in [MenuGeometry] below.
bPanelGeometryFO4VR=1
fPauseWidthMeters=1.48
fPauseDistanceMeters=0.78
fPauseHeightMeters=-0.045
; Menus whose game camera takes the view (character creation / LooksMenu, terminals under the game's terminal camera, ...)
; are shown as a panel over that camera's view (the SCENE method: game camera position + your head), not in the flat
; window. The flat window stays for the main menu, loading, credits, the scope and V.A.T.S. List more menus here to force
; them onto the flat window (comma-separated menu names as the log prints them), e.g. sWindowMenus=LooksMenu,TerminalMenu
sWindowMenus=
; 1 = no blurred, frozen background behind menus shown over the live world (it would move with your head).
bNoMenuBlur=1
; 1 = dialogue options on the same panel (not drawn into the stereo image between the eyes); options stay
; selectable wherever you look or point, the weapon is hidden while talking, one haptic pulse when options appear.
bDialoguePanel=1

[MenuGeometry]
; Per-menu panel size and place: <MenuName>=width,distance,height in metres (height = centre above (+) / below (-) eye
; level); the panel appears where you look when the menu opens. Wins over every built-in size. Menu names as the log
; prints them ("menu panel - -> <name>"): PauseMenu, DialogueMenu, ContainerMenu, BarterMenu, FavoritesMenu,
; MessageBoxMenu, LooksMenu, LevelUpMenu, Console, CookingMenu, ExamineMenu, ...
; Dialogue options (DialogueMenu, also with Extended Dialogue Interface): FO4VR's dialogue-band scale. Smaller distance
; = closer, larger width = bigger.
DialogueMenu=1.32,0.55,0.0
; Examples (remove the ; to use):
;PauseMenu=1.48,0.78,-0.045
;FavoritesMenu=1.2,0.8,-0.1

[Roomscale]
; Head authority: in first person the camera = capsule + low-passed game eye height + head offset, not the game's
; animated camera node, so body turns, animation bob and idle sway cannot move the view. 0 = old behaviour.
bHeadAuthority=1
; Eye-height smoothing time constant (s) for the game camera height above the capsule.
fEyeHeightSmoothS=0.6
; 1 = the eye height steps at once when sneak toggles (FO4VR: one-frame change on the sneak flag), instead of following
; the game's ~0.3 s sneak camera blend + the smoothing above. Ground height (stairs, slopes) is not affected. 0 = gradual.
bSneakHeightStep=1
; 1 = physical walking moves the player: the head's horizontal offset from the body is fed into the
; game's own movement (PlayerCharacter::ModifyMovementData), so it collides with walls and slides
; like stick movement; the camera only shows the small remainder (head - body). Leaning within the
; deadzone moves only the camera. 0 = the camera carries the whole head offset (no body movement).
bRoomscale=1
; Start moving the body when the head is this far from it (cm); stop when within fStopCm.
fDeadzoneCm=12
fStopCm=2
; While blocked (wall), or in states where the body cannot follow (VATS, furniture, AI-driven,
; third person ...), the camera is held within this distance of the body; the room slides instead.
fMaxResidualCm=25
; Absolute cap on head - body distance even when not blocked (cm), and the body's catch-up speed (m/s).
fHardMaxResidualCm=60
fMaxSpeed=4.0
; 1 = the body (weapon, movement direction) turns to the head's yaw when the head turns more than
; fBodyYawThresholdDeg away from it, and continuously while walking with the stick; the view itself
; never turns from this (stick/mouse turns still turn the room). 0 = body yaw only from stick/mouse.
bBodyFollowsHead=1
fBodyYawThresholdDeg=45
fBodyYawRateDeg=180
; 1 = disable the first-person camera spring (it makes the view trail every body move, a vection
; source in VR; also smooths stair steps in the flat game). Only applied while roomscale is active.
bNoCameraSpring=1
; Head position into the first-person camera: the engine feeds the camera's horizontal change back into
; the next frame's camera base, so the plain offset showed twice. 1 = add half (exact when still, a
; change shows over 2 frames), 2 = exact per frame (alternating internal change), 0 = old behaviour (2x).
iCameraFeedbackFix=1
; Overshoot fix: capsule motion no outstanding command explains (the character controller over-delivers the
; first command after rest) is booked to roomscale or to the stick by their recent activity (time constant
; fAttributionWindowS) instead of as external motion. 0 = old booking (camera could end 1-6 units past the
; room-stable position).
bAttributeOverDelivery=1
fAttributionWindowS=0.15

[Stereo]
; Single-pass stereo (analysis/stereo-poc-plan.md). The engine renders one double-wide image
; ([Render] iWidth = 2 x eye width): all camera-dependent GBuffer geometry (world + 1st-person camera)
; and the z-prepass are drawn once with 2x the instances, one per eye, into the left/right halves.
; Lighting/post are per eye too (per-eye b12 + split draws, per-eye TAA, SAO/SSR twins, per-eye motion blur and lens
; flare, guard pixels; analysis/stereo-poc-plan.md section 14.6). Default still 0: at IPD 0 every pass up to the
; tonemap matches to >= 99.9 % within 1 LSB, but the anti-aliased frame reaches 99.4-99.7 % (TAA/FXAA amplify float
; rounding differences between the halves), below the 99.9 % bar.
; 0 = off (no hooks installed), 1 = census (observe only, logs draw statistics), 2 = debug stereo
; (debug pixel shader on the converted meshes), 3 = faithful stereo (engine materials), 4 = identity
; (diagnostic: replacement VS, mono). Only a mode that renders the game correctly may be the default.
iMode=3
; 1 = install the hooks even with iMode=0, so the pipe ("stereo <n>") can switch modes at runtime.
bInstallHooks=1
; Stereo modes: skip the engine's mono depth pre-pass for the world camera and let the stereo GBuffer
; geometry write its own per-eye depth (needed: the GBuffer pass otherwise tests against mono depth).
bOwnDepth=1
; Stereo z-prepass: the prepass is converted too (early-Z kept, engine depth states); bOwnDepth is then
; only the fallback if the prepass shaders have no stereo twin.
bStereoPrepass=1
; The 1st-person camera (arms, weapon) is a stereo camera too.
bFirstPerson=1
; 0 = convert GBuffer writers + z-prepass; 1 = every world/1st-person camera draw whose VS has a twin.
iScope=1
; Test knobs: drop unconvertible world-camera geometry; synthetic parallel eyes (IPD in metres,
; horizontal half FOV per eye in degrees) instead of the headset's.
bSkipUnconverted=0
bTestEyes=0
fTestIpdMeters=0.064
fTestHalfFovDeg=45
; Draw statistics in the log every N presents (0 = never).
iLogEveryFrames=600
; Folder with StereoVS.pack (bytecode twins) and the HLSL debug shaders (compiled at device creation).
; Empty = Data\F4SE\Plugins\fo4flatvr_stereo
sShaderDir=
; Lighting round: shaders that read per-eye rows of the per-frame buffer (deferred lights, composite, water,
; decals, screen-space passes) are drawn once per half with a per-eye copy of b12 and a scissor.
bSplitDraws=1
; SAO's RawAO pass split per half with a per-eye projInfo (its cb2[0]) and its eye-relative noise twin (StereoPS.pack).
bSaoPerEye=1
; Stereo frames: SAO through its pixel-shader variant (splittable) instead of the compute variant.
bSaoPixelShader=1
; Eye far plane = this x the mono far plane. The engine pins sky/clouds to the far plane (z = w) in mono clip space;
; in an eye turned even slightly against the mono camera that geometry fell beyond the far plane and was clipped
; along straight lines (flat-coloured polygons in the sky that flicker with head motion). 1 = old behaviour.
fEyeFarScale=2.0
; Bytecode VS twins keep mono's depth-clip status (eye z clamped to [0, w] where mono z was inside): the same fix for
; near/far-pinned geometry drawn through the twins. 0 = old behaviour.
bKeepMonoDepthClip=1
; Per-eye TAA: the GBuffer motion vectors are converted per eye right before the TAA resolve (history taps
; clamped to the eye's half) and each eye gets the engine's TAA jitter. 0 = mono motion vectors, no eye jitter.
bTaaPerEye=1
; Hidden-area mask (FO4VR bUseHiddenAreaMesh): the pixels the headset lenses never show (the runtime's
; XR_KHR_visibility_mask) are stamped into depth before the world draws, so they are not shaded. Nothing changes
; where you can see. Needs the runtime to offer the extension (logged). Live. 0 = off.
bHiddenAreaMask=1
; Cut list, applied while a stereo mode (iMode 2/3) is configured (restored when the mode changes; menus and
; loading screens do not toggle it):
; TAA off (FXAA on). 0 = keep TAA (per-eye, see bTaaPerEye); FXAA alone flickers in the headset.
bCutTaa=0
; Motion blur (the game's own bMBEnable decides; it is off in default prefs): runs per eye (per-eye motion
; vectors, blur centre per eye). 1 = force it off in stereo.
bCutMotionBlur=0
; Depth of field runs per eye (blur kernels only; guard bands keep them off the other eye). 1 = off in stereo.
bCutDof=0
; Lens flare per eye (occlusion test in the eye's depth, sprites placed per eye). 1 = off in stereo.
bCutLensFlare=0
; NVIDIA godrays off: closed library fed one mono camera; base FO4VR does not have it either.
bCutGodrays=1
; Screen-space reflections per eye (prepass split per eye, ray march bounded to the eye). 1 = off in stereo.
bCutSsr=0
; HBAO+ forced off in stereo (re-applied every frame), matching FO4VR, which has no HBAO+. Expert override: 0.
bCutHbao=1
; Tiled (compute) deferred lighting runs per eye (StereoCS.pack twins, split dispatches). 1 = off in stereo (lights
; take the per-eye volume path). Only active when Fallout4Prefs.ini has bComputeShaderDeferredTiledLighting=1.
bCutTiledLighting=0
; SAO forced off in stereo (re-applied every frame, so bSAOEnable, the console "sao" or mods cannot turn it back on),
; matching FO4VR (AO forced off; NAC X VR: bVrAllowSAO=0, "floating shadows"). Expert override: 0 = per-eye SAO.
bCutSao=1
; Guard pixels per eye (not shown in the headset): each eye's render region is rounded up to a multiple of this
; (half of the extra pixels on each side of the eye), so reduced-resolution post passes line up between the eyes and
; blurs do not bleed into the other eye. 0 = off. 128 (15 Nov): some pass samples a 1/128-resolution buffer; at 64 the
; right eye started half a texel off its grid -> vertical stripes every 43 px in the mid distance (IPD-0 halves 98.0 % ->
; 99.25 % within 1 LSB at 5376x2880; +128 px render width).
iSeamAlign=128
; Minimum guard pixels per eye before the rounding (0 = only what the rounding adds). 32 keeps blur/TAA/SSR taps off
; the other eye even when the eye width is already a multiple of 64 (about 2-5 % more pixels).
iSeamGuard=32

[DLSS]
; 20 Nov (DLSS agent; plugin Dlss.cpp, analysis/dlss-in-fo4flatvr.md). NVIDIA DLSS at native resolution (DLAA) per eye, in
; place of the game's TAA draw. No ReShade / loader / Streamline: NGX on the game's own D3D11 device; the NVIDIA runtime DLLs
; are in F4SE\Plugins\fo4flatvr\ngx. While it runs, the TAA cut (bCutTaa) is lifted and FXAA forced off. All keys live.
bEnabled=1
; 1 = one DLSS instance per eye (sub-rects of the double-wide image); 0 = one shared instance over both eyes (test)
bPerEye=1
; render preset: 0 the DLSS 5 Feed's default (L), 1 driver default, 2 E, 3 F, 4 J, 5 K, 6 L, 7 M. 5 = K: measured 1.6 ms GPU for
; both eyes (L: 7.4 ms) and the steadier image; the Feed chose L for fewer NR speckles on bright text
iPreset=5
; 0 DLAA, 1 UltraQuality, 2 Quality, 3 Balanced, 4 Performance, 5 UltraPerformance: sent at creation; DLSS accepts every
; mode with the input at the eye size (rendering below it is not part of this build); a refused mode falls back to DLAA
iQuality=0
; NGX sharpness (the Feed's work_sharpness; current presets ignore it)
fSharpness=0.0
; 1 = the game's TAA jitter stays on (DLSS gets sub-pixel detail); 0 = no jitter
bJitter=1
; the Feed's jitter_sign per axis: 0 normal, 1 flipped
iJitterFlipX=0
iJitterFlipY=0
; the Feed's mv_scale_x / mv_scale_y (multipliers on the motion vector scale)
fMvScaleX=1.0
fMvScaleY=1.0
; the Feed's depth_inverted: 0 auto (the game's depth is not inverted), 1 not inverted, 2 inverted
iDepthInverted=0
bAutoExposure=1
; the Feed's flags: raw NGX create flags, -1 = ours
iCreateFlags=-1
; the game's TAA mask (RT 0x1E) as DLSS's bias-current-colour mask
bBiasMask=0
; also write the result into the game's TAA history target (DLSS off resumes cleanly)
bCopyHistory=1
; the Feed's reset_every / create_delay / warmup_rebuild / log_frames (frames; 0 = off)
iResetEvery=0
iCreateDelay=0
iWarmupRebuild=0
iLogFrames=3
; GPU cost line in the log every 600 frames
bGpuTimers=1

[NeuralRendering]
; 20 Nov (DLSS agent). NVIDIA's DLSS neural rendering model (nvngx_dlssnr.dll, NGX feature 18, RTX 50) per eye on a private
; D3D12 device (shared textures + one shared fence, GPU waits). Settings mirror RenoDX's [RenoDX.DLSS5] keys. All live.
bEnabled=1
; session toggle key (RenoDX NRToggleKey; 0x75 = F6), game window focused; not saved
iToggleKey=0x75
; 1 = one NR instance per eye; 0 = one shared instance with both eyes side by side (consistency test)
bPerEye=1
; 0 = after DLSS (RenoDX's default); 1 = on the game's raw jittered colour, before DLSS
iHookPoint=0
; NR working size per eye (NRResolutionScale, 0.33-1); bFollowInputRes=1 runs at the eye size
fResolutionScale=0.5
bFollowInputRes=0
; NRIntensity / NRColorStrength / NRTransferStrength
fIntensity=1.0
fColorStrength=1.0
fTransferStrength=1.0
; NRSdrBlackRestore: 0 off, 1 auto (near-black blocks), 2 every block, 3 smooth (near-black, tapered)
iSdrBlackRestore=3
; NRDetailStability: 0 auto (on after DLSS), 1 off, 2 always: NR's edit filtered over time (motion-vector reprojection,
; neighbourhood clip); fDetailStabilityAlpha = the new frame's share (RenoDX 0.15)
iDetailStability=0
fDetailStabilityAlpha=0.15
; NRDepthMode: 0 auto (not inverted), 1 normal, 2 inverted
iDepthMode=0
fMvScaleX=1.0
fMvScaleY=1.0
; model: NRPreset 0-3, NRStyle 0 Default 1 Natural 2 Cinematic, NRLocalTone, NRLocalStructure, NRSkinStructure (-1 stock),
; NRAutoMask (character mask), NRSkinIndependent, NRUICorrection
iPreset=0
iStyle=0
fLocalTone=1.0
fLocalStructure=1.0
fSkinStructure=-1.0
bAutoMask=0
bSkinIndependent=1
bUiCorrection=0
; NRPasses (1-4 chained passes) / NRChainedHistory; passes 2-4: Pass<N><key>, bFollowPass1 = model steering from pass 1
iPasses=1
bChainedHistory=1
Pass2bFollowPass1=1
Pass2fIntensity=1.0
Pass2fColorStrength=1.0
Pass2fTransferStrength=1.0
Pass2iStyle=0
Pass2fLocalTone=1.0
Pass2fLocalStructure=1.0
Pass2fSkinStructure=-1.0
Pass2bAutoMask=0
Pass2bUiCorrection=0
Pass3bFollowPass1=1
Pass3fIntensity=1.0
Pass3fColorStrength=1.0
Pass3fTransferStrength=1.0
Pass3iStyle=0
Pass3fLocalTone=1.0
Pass3fLocalStructure=1.0
Pass3fSkinStructure=-1.0
Pass3bAutoMask=0
Pass3bUiCorrection=0
Pass4bFollowPass1=1
Pass4fIntensity=1.0
Pass4fColorStrength=1.0
Pass4fTransferStrength=1.0
Pass4iStyle=0
Pass4fLocalTone=1.0
Pass4fLocalStructure=1.0
Pass4fSkinStructure=-1.0
Pass4bAutoMask=0
Pass4bUiCorrection=0
; RenoDX v8.5 look stage (look_stage.hpp, NRLook*), 4 compute passes per eye with their own history: reshapes NR's edit
; e = log2(N/P) (bands, temporal filter, gains), then the edge-aware transport to the eye size when NR runs below it.
; bLook=0 = the earlier pipeline (area-mean input, bilinear edit, its own detail-stability pass). With bLook=1 detail
; stability (iDetailStability / fDetailStabilityAlpha above) runs inside the look's compose, as RenoDX does.
bLook=1
; NRLookMode: 1 = apply the gains below (each default is the identity, so the image does not change until one is moved)
bLookMode=1
; NRLookStrength / Brighten / Darken (gains on the edit, 0-2); NRLookMaxBrighten / MaxDarken (soft limits in stops, 0 = off, 0-4)
fLookStrength=1.0
fLookBrighten=1.0
fLookDarken=1.0
fLookMaxBrighten=0.0
fLookMaxDarken=0.0
; NRLookColour (saturation change) / NRLookHue (tint change), 0-2; NRLookMaxColour (soft limit, 0 = off, 0-2)
fLookColour=1.0
fLookHue=1.0
fLookMaxColour=0.0
; NRLookShadows / Midtones / Highlights: edit gain per luminance zone, 0-2
fLookShadows=1.0
fLookMidtones=1.0
fLookHighlights=1.0
; NRLookTone (broad band) / NRLookDetail (fine band), 0-2; NRLookDetailRadius: band radius, % of the NR height (0.25-4)
fLookTone=1.0
fLookDetail=1.0
fLookDetailRadius=1.0
; NRLookHalo: lift NR's darkening beside brighter pixels; NRLookHaloBrightSide: the dark skirt beside dark objects (0-1, 0 = off)
fLookHalo=0.0
fLookHaloBrightSide=0.0
; NRLookStabilize: 0 off (detail stability decides), 1 static, 2 motion-compensated; NRLookStabilizeMs 10-250;
; NRLookStabilizeDetail: 1 = the fine band too
iLookStabilize=0
fLookStabilizeMs=60.0
bLookStabilizeDetail=0
; NRLookUpsample (NR below the eye size): 0 auto / 1 edge-aware (point-sampled model input), 2 classic (bilinear edit),
; 3 edge-aware with an area-mean input. A change of input restarts NR's history.
iLookUpsample=0

[Camera]
; Camera step 0: VR comfort fixes made with engine settings/data only (no code hooks).
; 1 = no aim-down-sights zoom while the head-tracked world view is shown (PlayerCamera adjustFOV cleared):
; iron sights stay at the headset FOV, so the world does not magnify or swim. Scoped weapons (ScopeMenu)
; still switch to the flat screen with the game's zoom. 0 = the game's ADS zoom.
bNoAimZoom=1
; 1 = dialogue stays in first person (bDialogueCameraEnable:Interface = 0, also re-applied if the in-game
; option turns it back on) and head-tracked in the world view. 0 = the game's setting.
bFirstPersonDialogue=1
; 1 = no VATS kill cams (fKillCamBaseOdds = 0, fKillCamLevelMaxBias = 0) and no VATS player-death camera
; (bVATSPlayerDeath:VATS = 0). 0 = the game's values.
bNoKillCams=1
; 1 = no idle third-person orbit camera (bDisableAutoVanityMode:Camera = 1, PlayerCamera allowAutoVanityMode
; kept 0). 0 = the game's behaviour.
bNoIdleOrbit=1
; Camera step 1: the camera director (post-hook on TESCamera::Update, call 1026035). Each camera state gets a
; policy: TRACK = head-tracked world view (rotation = owned heading x head, the game's translation + head
; offset); SCENE = the AAF free-camera method for any game camera: the game camera's position + your head motion
; since entering it, its yaw x your head (its pitch dropped), cuts blink, controls as on the flat screen; FADE_SNAP = fade to black, hold the last pose, snap to the new pose, fade in (fFadeTimeoutS -> CINEMA);
; LOCK = head-tracked, translation frozen where the last tracked pose was; CINEMA = flat-screen fallback (opt-in only).
; 0 = no hook: first person is the world view, every other camera state the flat screen (as before).
bCameraDirector=1
; Policy per camera state (TRACK | SCENE | FADE_SNAP | LOCK | CINEMA). Flat Fallout 4 keeps iron sights in FirstPerson.
; 15 Nov (user): no flat panel rendering a scene unless a state opts in with CINEMA. VATS keeps the VATS window.
sPolicyFirstPerson=TRACK
sPolicyAutoVanity=SCENE
sPolicyVATS=CINEMA
sPolicyFree=SCENE
sPolicyIronSights=TRACK
sPolicyTransition=SCENE
sPolicyTween=SCENE
sPolicyAnimated=SCENE
sPolicyThirdPerson=SCENE
sPolicyFurniture=TRACK
sPolicyMount=SCENE
sPolicyBleedout=SCENE
sPolicyDialogue=SCENE
; Fade duration (ms, each way) and the longest a FADE_SNAP state may stay black (s) before the flat screen.
fFadeMs=100
fFadeTimeoutS=0.1
; TRACK: a jump of the game's camera translation larger than this (units, one update) blinks: fade out on
; the held pose, snap, fade in (power-armour enter/exit orbit camera, warps). 0 = off.
fJumpFadeUnits=50
; 1 = we own the view heading: only stick/mouse turning (and teleports/recentre) turns the view; the game
; turning the player (setangle, VATS auto-aim, furniture entry, power armour, dialogue facing) turns the body
; only. 0 = the view follows the game's player rotation and pitch as before.
bOwnHeading=1
; Camera step 2 gates (FO4VR-style; each byte-checked, 0 = not patched). PAUSED: all 0 until verified.
; StartFurnitureMode -> HUD mode only: chairs, workbenches, terminals stay first person, head-tracked, no orbit.
bGateFurniture=0
; Same for power-armour furniture (enter/exit orbit camera), plus a black hold while the player's sit state is
; set (longest fPowerArmorHoldS), then a snap (and heading snap) and fade in.
bGatePowerArmor=0
fPowerArmorHoldS=0.1
; StartAnimatedMode -> no-op: animated/scripted camera stays first person.
bGateAnimated=0
; Set3rdPerson / Force3rdPerson -> no-op (no third person view). Default 0 (third person = the SCENE view).
bBlockThirdPerson=0
; 1 = a third person a script put you in (Game.ForceThirdPerson, e.g. an AAF scene that ends in third person, or the
; free camera ending in third person) goes back to first person once you have been in control again (not AI-driven,
; not sitting, no menu) for fThirdPersonReturnS. Your own POV toggle is never undone. 0 = stay in third person.
bThirdPersonReturn=1
fThirdPersonReturnS=1
; 20 Nov, camera-lock comparison modes (analysis/third-person-vr.md section 8). Both live: VR panel Camera page, or
; pipe "camdir lock on|off" / "camdir body on|off".
; bLockFirstPerson=1: every engine request to leave first person is refused, VATS excepted: third person (POV toggle,
; mouse-wheel zoom, scripts, AAF), the free camera (tfc / AAF), furniture / workbench / terminal / power-armour cameras,
; animated and scripted cameras, bleedout, mounts; the dialogue camera, kill cams, the VATS death cam and the idle orbit
; are forced off (bFirstPersonDialogue / bNoKillCams / bNoIdleOrbit); any other non-first-person state is sent back with
; Force1stPerson; F3 to third person is refused. Overrides bBlockThirdPerson, bGateFurniture, bGatePowerArmor,
; bGateAnimated and the AAF third-person pass. 0 = the per-gate keys above decide.
bLockFirstPerson=0
; 28 Nov: the furniture gates (bLockFirstPerson, bGateFurniture / bCraftingLiveWorld, bGatePowerArmor) hold only furniture
; with a first-person replacement: workbenches (crafting menu opened directly, bWorkbenchDirectMenu) and terminals (on their
; monitor, [Menus] bTerminalInWorld). Every other furniture (power-armour frames, chairs, couches, beds ...) runs the game's
; own furniture camera - its enter animation needs the third-person graph; refused, the sit never completes - and the lock
; waits for it, then first person again. 0 = every furniture refused.
bFurnitureSequencePass=1
; 28 Nov: while such a furniture sequence holds the game's furniture camera, it is shown as a SCENE view like the other
; third-person cameras (game camera position + head turn, game pitch dropped). 0 = sPolicyFurniture decides.
bFurnitureSequenceScene=1
; bBodyCamera=1: whatever the camera state (except first person / iron sights, already there, and VATS), the camera is
; the first-person eye on the player body (capsule + first-person eye height + your head offset), turned by the owned
; heading x your head; the game camera's position and the sPolicy table are ignored; the player's head is hidden while
; the third-person body shows (bPovHeadHide). 0 = the sPolicy table decides.
bBodyCamera=0
; 1 = with bBodyCamera=1, while your body is animated away from where it stands (AAF and other scenes, furniture,
; paired animations, bleedout: a scene / furniture / bleedout signal, or the animated eye more than 24 units from the
; capsule eye) the eye is your animated third-person Head bone + fBodyCameraEyeForward along the face, blended in 0.3 s
; (a jump over 40 units is a cut). Walking / idle head bob stays on the capsule. Rotation stays head-tracked; the head is
; hidden as before (bPovHeadHide). 0 = always the capsule position. Live.
bBodyCameraFollowsAnimation=1
; units from the animated Head bone to the eye, along the face (bBodyCameraFollowsAnimation). Live.
fBodyCameraEyeForward=8
; 1 = with bBodyCamera=1, the free camera at ANOTHER actor's head (AAF POV on an NPC, within fPovHeadRadius of its Head
; bone) is shown from there (SCENE: AAF's POV point + your head motion); AAF's other shots and the POV on you stay on
; your own animated head. 0 = bBodyCamera always uses your own head. Live.
bBodyCameraYieldsToPov=1
; 1 = a HUD message on every camera state change (third person, free camera, furniture ...) and every view mode change
; (SCENE / TRACK / CINEMA / LOCK / FADE_SNAP, by F2, a gesture, the panel or an automatic rule) and on a request the
; first-person lock refused. 0 = off (F2 / F3 / gestures then show their own message as before).
bCameraHudNotify=1
; 1 = the controls are the same in every camera view: no menu open = the first-person gameplay bindings (move, turn, jump,
; fire, activate ...) in SCENE, CINEMA, third person and the free camera too; comfort turning / stick direction follow the
; head-tracked view; the menu pointer only on a shown menu. 0 = the 15 Nov mapping (flat-screen menu layout outside the
; first-person world view).
bSameInputAllViews=1
; 20 Nov late (AAF / defeat scenes, analysis/mod-aaf-vr.md section 13), all live:
; bLockAllowScenes=1: with bLockFirstPerson, an AAF scene (player AI-driven / AAF_ActorBusy) or a defeat flow (the player's
; bleedout, and fDefeatWindowS seconds after it, when defeat mods such as AAF Violate call ForceThirdPerson) keeps its
; cameras: bleedout, the script's third person and AAF's free camera pass; the lock's Force1stPerson backstop waits
; until 2 s after the scene's last signal. 0 = the lock refuses them too (defeat scenes then fail).
bLockAllowScenes=1
; seconds after a bleedout in which a script's third person counts as the defeat flow (also for bBlockThirdPerson's
; AAF pass, bFreeCamAAFThirdPerson). 0 = only while bleeding out / AI-driven / AAF-busy.
fDefeatWindowS=30
; 1 = sPolicy<State>=TRACK on a game orbit camera (AutoVanity, ThirdPerson, Mount, Bleedout, Dialogue) is shown as SCENE:
; TRACK turns the orbit camera by the owned heading x head, so the view and the movement followed the head there.
; 0 = TRACK as written.
bOrbitStatesScene=1
; 1 = in the free camera (AAF scenes, tfc) the right stick's turn is kept as our own yaw on top of the camera's, for the
; whole scene: AAF's POV (pov_control_mode=auto) glides a turned camera back to the actor's gaze 1.2 s after the last
; look input. 0 = the turn goes into the free camera as before.
bFreeCamOwnStickYaw=1
; 1 = the free camera's position is the free-camera state's own (written by AAF after the game's update: POV head
; anchor, glides), not the camera root the game wrote before AAF (one frame behind the animated head). 0 = the root. Live.
bFreeCamStatePosition=1
; 1 = a Pip-Boy press the game refuses is logged with its reason (HUD "Pip-Boy blocked: ..."), and what a finished scene
; left behind is released at that press: the player's AI control (Game.SetPlayerAIDriven) while you can walk, input
; layers that started disabling the Pip-Boy during an AAF / defeat scene, a stuck Pip-Boy "opening" flag. Pipe
; "camdir aftercare". 0 = off.
bSceneAftercare=1
; Start/ForceVATSMode -> no-op (StopVATSMode too when nothing was pushed): VATS stays first person, head-tracked,
; no zoom, VATSMenu in the world view. bVatsKeepCamera: after VATS ChangeState(2) re-enable the camera and un-cull
; the player geometry (VG2).
bGateVats=0
bVatsKeepCamera=0
; StopPipboyMode runs TESCamera::Update itself: hook that call too so the director sees that frame.
bPipboyStopTick=0
; A game-driven heading change (setangle, scripts) of at least fHeadingSnapDeg in one update fades out, turns the
; view to the body's new heading, fades in (needs bOwnHeading=1; not while VATS is on).
bHeadingSnap=0
fHeadingSnapDeg=45
; Free-camera scene view (AAF scenes, also console tfc; analysis/mod-aaf-vr.md). 1 = the director also runs in the
; free camera (thunk 1026290, byte-checked) and the free camera is a head-tracked world view instead of the flat
; screen: position = the free camera's (AAF's shot, its POV head point, or where you fly it), turn = the free
; camera's yaw x your head (its pitch dropped). Overrides sPolicyFree. Cuts blink (fJumpFadeUnits for position,
; fFreeCamYawCutDeg for a yaw jump in one update); a game-driven camera move faster than fFreeCamGlideSpeed
; (units/s, controller sticks idle; 0 = off, the default since 15 Nov) is held black until it has moved slower than
; 15% of that for 0.25 s (longest fFreeCamGlideHoldS, once per glide); a CINEMA third-person state fades for
; fThirdPersonGraceMs first. The same blinks apply to every SCENE state.
; bFreeCamBody: entering the free camera straight from first person (bBlockThirdPerson) shows the third-person body.
; 0 = off: no patch, the free camera follows sPolicyFree (CINEMA) as before.
bFreeCamScene=1
bFreeCamBody=1
fFreeCamYawCutDeg=20
fFreeCamGlideSpeed=0
fFreeCamGlideHoldS=0.1
fThirdPersonGraceMs=100
; 1 = a Force3rdPerson while the player is AI-driven (AAF's scene lock comes right after its walk package) passes
; bBlockThirdPerson, as in the flat game: the player has the third-person body and behaviour graph before AAF's first idle
; (gated, idles stuck / scenes stuck in Transitioning). 0 = gated like any other third-person request.
bFreeCamAAFThirdPerson=1
; 1 = flying the free camera with the sticks goes where the head-tracked view looks (yaw and pitch), not along the free
; camera's own rotation (AAF's shot). The stick's turn still turns the camera. 0 = the game's free-camera frame.
bFreeCamMoveWithView=1
; 1 = in the free camera only head motion since the scene entry / last cut moves the view (it sits exactly at AAF's POV
; head point); 0 = the whole head offset from the recentre origin is added.
bFreeCamHeadDelta=1

[Weapon]
; Floating gun = the Fallout 4 VR baseline (plugin README "Floating gun"): in the head-tracked first-person world view
; the weapon (WEAPON node only, after the frame's animation, call site C351F3) sits where the primary controller
; (right; left with [Controllers] bLeftHanded=1) holds it, using FRIK's hand glue and per-weapon offsets
; (fo4flatvr_weapons\<name>.json); shots and aim come from its fire node. 0 = no patches, arms not hidden.
; Body, arms, IK, fingers and two-handed grip are FRIK / ROCK features (the old [Hands] stage 2 keys are retired).
; The keys below are also read from an old [Hands] section when [Weapon] does not have them.
bFloatingGun=1
; No aim randomness outside VATS: the player's shots get no cone of fire (spread), hip fire and iron sights alike, so a
; miss is the sights / hand alignment, not a dice roll (same effect as aim-model cone of fire = 0 in "More Accurate
; Weapons", for every weapon and mod). VATS hit chance and rolls, recoil and grenades are unchanged. 0 = game spread.
bNoSpread=1
; 1 = also no pellet spread for multi-projectile weapons (shotguns fire every pellet down the aim line). 0 = shotguns
; keep their pellet pattern.
bNoSpreadPellets=0
; 1 = no first-person arms while a headset feeds the plugin (FO4VR shows none): the first-person body/arm/hand/Pip-Boy
; models are culled, the weapon model stays. The wrist Pip-Boy quad ([Pipboy]) is unaffected.
bHideArms=1
; 1 = the weapon's handle (the grip mod's bound centre, attached at the receiver's P-Grip point) sits at the controller
; grip origin (OpenXR: centre of the hand's grip), keeping the FRIK JSON / auto-align rotation; 0 = WEAPON origin from
; the FO4VR wand offset (0,-4,1) + FRIK hand glue (the handle then sits several cm off). Weapons without a grip node use 0.
iGripAnchor=1
; Handle centre relative to the grip origin, grip frame (right, forward, up; cm).
fHandleOffsetX=0
fHandleOffsetY=0
fHandleOffsetZ=0
; 1 = keep the first-person rig at rest under [Roomscale] bHeadAuthority=1: the engine fits the rig root to the camera
; from the previous frame's Camera bone, so a head-authority camera made the rig (arms, anything attached to it) jump
; between two positions every frame (measured 5-19 u, never settling). The rig fit gets the vanilla value instead; the
; camera is unchanged. 0 = old behaviour.
bStableRig=1
; 1 = diagnostics for the arm hiding in the log (fo4flatvr.log, "arms diag" lines every 2 s). Test only.
bArmsDiagLog=0
; Controller grip -> FO4VR wand frame calibration, in the grip frame (X right, Y forward through the fist, Z up):
; offset in cm, then rotation about X, then Y, then Z (degrees). -60 about X puts the barrel on the aim pose under
; SteamVR's Touch profile (measured with vremu: aim -Z is 60 deg below grip -Z); other runtimes/profiles may differ.
fGripOffsetX=0
fGripOffsetY=0
fGripOffsetZ=0
fGripRotXDeg=-60
fGripRotYDeg=0
fGripRotZDeg=0
; 0 = FRIK JSON for the weapon if there is one, else rotate the weapon so its fire node points along the controller
; aim; 1 = always that auto-align; 2 = JSON or the skeleton bind only.
iAlign=0
; 1 = the controller aim ray (shots, activation) starts at the weapon's fire node and runs along its barrel.
bAimFromMuzzle=1
; 1 = the gun-blocked test never lowers the hand-held gun (the P clamp still keeps shots on the eye's side of walls).
bNoGunLowering=1
; FO4VR kickback (bUseKickback:VR): each shot pushes the gun back along the wand, (1 - t/duration)^2, amplitude and
; duration between the min/max values by the shot's aim-model recoil (units, seconds; FO4VR defaults).
bUseKickback=1
fKickbackMinOffset=2
fKickbackMaxOffset=20
fKickbackMinDuration=0.25
fKickbackMaxDuration=2.8
; FO4VR bUseRecoil:VR: the aim model's recoil (which flat applies to the view; the controller aim suppresses that)
; rotates the gun on the wand instead, so the barrel and the shots kick up/sideways as in FO4VR.
bUseRecoil=1
; 1 = melee / hand-to-hand weapons (type 0..6) sit on FO4VR's PrimaryMeleeWeaponOffsetNode (wand + (0,-4,0), no
; rotation) instead of the gun chain.
bMeleeNode=1
; 1 = the gun floats in power armour too (FO4VR shows no arms there either; the PA arms are hidden with the others).
bInPowerArmor=1
; Controller stand-ins (FO4VR shows a model on each controller): the off hand's always, the primary hand's while no
; weapon model is placed (holstered, unarmed, menus excepted). Models: FO4VR's Vive_Wand.nif fallback, one file per
; hand (installed by plugin/tools/install_controller_models.py from the Fallout 4 VR install). Missing file = no model.
; Placement in the FO4VR wand frame (grip . fGripRot above): offset cm, rotation X, Y, Z degrees, uniform scale
; (1 = the model is in metres, as FO4VR's render-model NIF, scaled by [General] fUnitsPerMeter).
bControllerModels=1
sControllerModelRight=Data/Meshes/fo4flatvr/ControllerR.nif
sControllerModelLeft=Data/Meshes/fo4flatvr/ControllerL.nif
fControllerModelOffsetX=0
fControllerModelOffsetY=0
fControllerModelOffsetZ=0
fControllerModelRotXDeg=0
fControllerModelRotYDeg=0
fControllerModelRotZDeg=0
fControllerModelScale=1

[Scope]
; Scopes like Fallout 4 VR (plugin README "Scopes", work/handoff/scopes.md; all live). Bring a drawn scoped gun up to the
; eye (FO4VR's test: eye-scope distance < 38 units, within 25 deg of where you look and 7 deg x (60 / distance)^2 of the
; gun's aim, the scope point per weapon class as FO4VR; lowered past 40 u / 35 / 15 deg = out): the world fades to black
; as it comes up, then the game's own scope runs (aim held: zoom, sway, hold breath) and the scope view - the stereo render
; looking along the gun with FO4VR's scope zoom, round, the game's own reticle on top - shows on FO4VR's scope lens on the
; gun (22.4 cm across, 14 cm above the hand), black around it. 0 = as before (no Touch path into the scope; a scope the
; game opens shows on the flat window).
bEnabled=1
; Lens size x (FO4VR fScopeScale 1) and height above the hand in game units (FO4VR fScopeOffsetZ 10).
fLensScale=1.0
fLensOffsetZ=10
; Override instead of FO4VR's lens: angular diameter (degrees) at a distance along the aim (metres). 0 = FO4VR's lens.
fViewDeg=0
fViewDistance=0
; Blackout fade as the gun comes up (FO4VR fScopeFadeMagnitude 1.25; 0 = no fade).
fFadeMagnitude=1.25
; x the scope zoom (1 = FO4VR: the weapon's ZoomData on a 70 deg base).
fZoomScale=1.0
; The game's reticle: 1 = the ScopeMenu overlay (its glass target), 2 = its movie target, 0 = the menu panel copy.
iOverlaySource=1
; Size of the game's overlay on the image (1 = its circle fills the image).
fOverlayScale=1.0
; Our duplex crosshair: 0 never, 1 only while the game's reticle is missing, 2 always.
iReticle=1
; Primary grip holds breath while scoped (FO4VR's ScopeMenu hint); that press does not reload or throw.
bHoldBreathGrip=1

[Comfort]
; Locomotion comfort (C8). Turning with the right stick X in the head-tracked first-person world view:
; 1 = snap turn (fSnapTurnDeg per flick past fSnapThreshold; the stick must come back below fSnapRearm before the
; next one, at most one per fSnapCooldownMs), 0 = smooth turn at fSmoothTurnDegPerSec (full deflection; fTurnDeadzone
; rescaled), 2 = the game's own right-stick look speed (as before). In modes 0/1 the stick X no longer reaches the
; game; the turn goes through the owned heading (roomscale movement hook), so body and view turn together exactly
; once. Furniture, VATS, menus and the flat screen keep the game's stick.
iTurnMode=0
fSnapTurnDeg=30
fSnapThreshold=0.7
fSnapRearm=0.35
fSnapCooldownMs=250
fSmoothTurnDegPerSec=120
fTurnDeadzone=0.15
; Left stick "forward" direction: 0 = where the head looks, 1 = where the off-hand controller points (left; right
; with [Controllers] bLeftHanded=1), 2 = the body (the game's own: body heading).
iMoveDirection=0
; 1 = darken the edge of view while moving with the stick or turning (head-locked layer above the world, below
; the HUD; never in the game image). Strength 0..1: higher = narrower clear view (0.6 = clear within ~40 deg of
; the view centre, black beyond ~65 deg). Fades in/out over fVignetteFadeMs.
bVignette=1
fVignetteStrength=0.6
fVignetteFadeMs=100
; Comfort effects (ComfortEffects.cpp; each 1 = suppressed, 0 = as in the flat game). Read at game start.
; 1 = no camera shake at all (explosions, power-armour footsteps/landings, scripted and console shakes), like FO4VR.
bNoCameraShake=1
; 1 = no radial (zoom) blur from image-space modifiers (explosions, VATS, criticals; centred on the eye seam in
; stereo). FO4VR has none either.
bNoRadialBlur=1
; 1 = no double vision ("get hit" effect: hits, concussion / crippled head, explosions, some chems).
bNoDoubleVision=1
; 1 = no full-screen blur from image-space modifiers (concussion, damage, menu backdrops).
bNoImodBlur=1
; 1 = no depth of field at all. 0 by default: the image-space DOF strength is above 0 at rest outdoors, so DOF
; pulses from effects cannot be told apart from the world's own DOF look; 1 removes both.
bNoDepthOfField=0

[PowerArmor]
; Power armour, the FO4VR way (FO4VR replaces the flat screen-attached PA dash and visor rain with its own
; head-following helmet overlay, and shows the PA Pip-Boy projected in front of the head).
; PAUSED (14 Nov): implemented but not yet verified in game, so all three are 0 for now.
; 1 = the PA dash (helmet frame, dials, compass) leaves the world image and is shown under the HUD on the
; HUD layer ([HUD] bSeparateHud=1 needed). 0 = drawn into the world image as in the flat game.
bHudOnLayer=0
; 1 = no visor rain in the head-tracked world view (FO4VR has none). 0 = rain as in the flat game.
bHideVisorRain=0
; 1 = in power armour the Pip-Boy opens directly (no camera move) on a screen in front of you that follows
; your head with a short lag; point the right controller (left with bLeftHanded=1) at it, the trigger clicks,
; the thumbstick scrolls, B closes. 0 = flat-screen fallback in power armour.
bProjectedPipboy=0
; Projected screen: distance ahead of the eyes, centre height relative to eye level (negative = below),
; width (m), and how far it lags behind the head (seconds; 0 = fixed to the head).
fPipboyDistanceMeters=0.60
fPipboyHeightMeters=-0.12
fPipboyWidthMeters=0.50
fPipboyFollowSeconds=0.30

[Dialogue]
; PAUSED (14 Nov): implemented and built, not yet verified in game -> every part OFF for now.
; VR dialogue (FO4VR's way; plugin README "VR dialogue"). Conversations stay in the head-tracked world view
; ([Camera] bFirstPersonDialogue=1).
; 1 = once a conversation is open its options stay enabled wherever you look or point (FO4VR's rule). 0 = flat
; behaviour: the options are enabled only while the hand ray / crosshair is on the speaker (no code patched).
bLookAnywhere=0
; 1 = the dialogue options leave the world image and are shown on their own panel below your view that stays
; level and follows your head turns with a short lag. 0 = drawn into the world image as in the flat game.
bPanel=0
; Panel: distance ahead of the eyes and below eye level (m), width (m), tilt toward the eyes (deg, 0 = upright),
; follow time constant (s) and how far the head may turn before the panel follows (deg).
fDistanceMeters=0.6
fDownMeters=0.2
fWidthMeters=0.6
fPitchDeg=0
fLagSeconds=0.3
fDeadzoneDeg=20
; Part of the dialogue movie shown on the panel (fractions of the screen, 0..1): the options area.
fCropLeft=0
fCropTop=0
fCropRight=1
fCropBottom=1
; Capture source: 63 = the menu movie (0x3F), 62 = after the HUD-glass effect (0x3E).
iSourceTarget=62
bPremultiplied=1
; 1 = the held weapon is hidden while talking (FO4VR does the same).
bHideWeapon=0
; 1 = a short vibration on the pointing hand's controller when the options appear.
bHaptics=0
fHapticAmplitude=0.3
fHapticSeconds=0.12
; 1 = the controller laser pointer works on the panel (point at an option, trigger picks it).
bPointer=0
; 1 = Fallout 4 VR's dialogue control: flicking the aiming hand's thumbstick picks a response at once, always in the same
; direction: up = question, right = sarcastic / negative, down = positive (yes), left = neutral. A flick while the other
; person is still talking skips their line (as FO4VR). With Extended Dialogue Interface the list row for that response is
; picked. 0 = off (the stick does nothing in conversations; face buttons / pointer as before). Live.
; (Replaces bStickOptions, which is no longer read.)
bStickResponses=1

[FRIK]
; FRIK-flat (FRIK.dll built for flat 1.11.240 from G:/Fallout4ToVR/frik-flat; plugin FrikBridge.h). Only matters when
; FRIK.dll is in Data/F4SE/Plugins. 0 = FRIK.dll stays dormant (no hooks, no patches).
bEnable=1
; 0 = FRIK.dll runs only FRIK's smooth movement (below): none of FRIK's hooks, patches, skeleton or frame, and the
; floating gun, hidden arms, controller models and per-hand activation stay exactly as without FRIK.dll.
; 1 = FRIK's full body: body under the head, arms following the controllers (IK), fingers (default). The floating gun
; keeps placing the drawn weapon with FRIK's glue + weapon JSONs (flat's first-person rig cannot be driven by FRIK's arm
; placement); its controller models are hidden while the body is active. Off switch: bBody=0.
bBody=1
; World near plane (game units) while the body is on: the game's 15 (21 cm) cuts FRIK's shoulders/upper arms close to the
; eyes. 0 = keep the game's fNearDistance:Display.
fNearDistance=5
; 1 = the old full gun step-aside while FRIK is active (no weapon placement by the floating gun).
bGunStepsAside=0
; 20 Nov (FRIK-flat C41): FRIK's own both-sticks config shortcut. Its UI is drawn by the framework's overlay renderer, which
; needs FO4VR's compositor and stays inert on flat, so the shortcut opened an invisible config. 0 = skipped (default); 1 =
; FRIK's shortcut as in FO4VR (for when a flat overlay renderer exists). Read once at load.
bConfigShortcut=0
; FRIK's own wrist Pip-Boy opening (look at the wrist / FRIK's open button -> the game's Pip-Boy). 0 = suppressed (default
; since 15 Nov, FRIK-flat C30: it fought fo4flatvr's Pip-Boy panel); 1 = FRIK opens it as in FO4VR. Re-read about once a
; second (live). FRIK's Pip-Boy options (look-at thresholds, dampening, ...) are on the VR settings panel's FRIK > Pip-Boy page.
bFrikPipboy=0
; FRIK's smooth movement (FO4VR "SmoothMovementVR"): smooths the camera's height (and position) over uneven ground,
; stairs and small bumps. Tuning in Documents/My Games/Fallout4/FRIK-flat/FRIK_Config/FRIK.toml [SmoothMovementVR]
; (SmoothAmount, Damping, StoppingMultiplier; the *Horizontal keys only with bSmoothHorizontal=1). Needs FRIK.dll.
; 0 = off (camera height follows the capsule directly).
bSmoothMovement=1
; 1 = FRIK also smooths the horizontal position (FO4VR FRIK default). 0 = height only: with roomscale a physical step
; or lean moves the capsule after the head and horizontal smoothing lags it (measured: 20 cm head step -> camera off by
; up to 14 cm, 2-5 cm still after 3 s), and running puts the camera 55-75 cm behind the body.
bSmoothHorizontal=0
; FRIK-flat auto body height (C36, bAutoBodyHeight=1 default): 1 = the body height is measured only at a recentre
; (calibrate: F8, the recentre gesture, the automatic start-up anchor) and stays fixed until the next one. 0 = it follows
; the camera's standing height continuously (4 s low-pass), as before 20 Nov.
bBodyHeightOnRecentre=1
; FRIK-flat VRIK-style legs (C42, 20 Nov; analysis/vrik-legs.md): 1 = while moving, the legs follow the game's own
; third-person walk/run/sneak animation (each foot where the animation puts it, re-solved with FRIK's leg IK); standing, the
; feet stay planted in the world and take short steps when you turn past ~6 degrees or step in the room. 0 = FRIK's own
; invented walk cycle (camera-speed steps). Live (re-read within a second).
; Needs bBodyGraph=1: without the body graph the engine does not play the walk/run cycle on the first-person body's legs
; (20 Nov rollback: leg pose unchanged for 120 of 120 frames while walking); FRIK's walk is then used. Holstered strafe /
; walk back: the forward stride is turned to the move direction (the game has no holstered sideways clips).
bAnimatedLegs=1
; FRIK-flat body animation graph in first person (C43, 20 Nov; analysis/first-person-body-mods.md): 1 = the game's
; third-person animation graph runs on the FRIK body while you are in first person (walk / run / strafe / sneak / jump /
; swim, draw and holster mirrored from the first-person graph), its footstep / hit events discarded, and the engine's copy
; of the first-person skeleton onto the body skipped. Handed back to the game while seated, in furniture / power armour
; enter-exit, paired animations, knocked down, dead, saving, loading and in other camera states. 0 = the game's own
; first-person body (legs keep the first-person skeleton's still pose). Live.
bBodyGraph=1
; FRIK-flat body graph speed (C43b, 20 Nov): 1 = the third-person graph run in first person gets its own "Speed", as the
; game computes it in third person: the desired speed, mapped through that graph's own speed contour, with the contour's
; playback-speed adjustments applied to it (the game only does this for the active, first-person graph). 0 = it reuses the
; first-person graph's channel value and gets no playback adjustments (20 Nov user report: the walk cycle plays far too
; slowly; running looks right). Live.
bBodyGraphSpeedContour=1
; FRIK-flat view switch sync (C44, 20 Nov; frik-src/PovSwitchSync.h): 1 = a first / third person switch (VATS playback
; camera, POV, scripts) always runs completely with the FRIK body shown. The game skips the switch when the cull flags of
; its two 3D roots already look like the requested view; with FRIK's body shown and VATS hiding the first-person root that
; happened on VATS playback: no animated body in the VATS camera, shots from the first-person muzzle, and on return the
; third-person graph stayed active in first person (the first-person camera stuck at the last height, e.g. crouched).
; Also puts the animation graph back if it is ever left on the third-person one in first person (logged "C44"). 0 = off. Live.
bPovSwitchSync=1
;
; FRIK-flat head outside first person (C45, 22 Nov; user: "First vats test I did, nora had no head"): 1 = while the camera
; is not first person (VATS playback, third person, dialogue, furniture; not the free camera, where the AAF POV head hide
; works), the player's FaceGen head node is never left hidden, whatever hid it (FRIK's own head hide only shows again what it
; hid itself). Logged "C45". 0 = off. Live.
bShowHeadOutsideFirstPerson=1
;
; Hides / shows through the engine (22 Nov; user: "First vats test I did, nora had no head"; one switch for FRIK-flat and
; fo4flatvr): 1 = every node hide / show (FRIK-flat head hide C39 / C45, FRIK.toml head / skin / slot hides, hand / fist /
; weapon hides, bone spheres, Pip-Boy lights; fo4flatvr floating gun, dialogue weapon cull, AAF POV head hide) also calls the
; game's own SetAppCulled on the main thread, which marks the node and its parents as changed for the renderer. 0 = only the
; hide bit is set directly (the old way: the head shown again for a VATS playback stayed undrawn). Live.
bEngineCullFlag=1
; FRIK-flat skin restore onto the live bones (C23b, 22 Nov): 1 = when the view leaves first person, every skinned piece of the
; player (body, outfit, head parts) reads its animated bones again - each skin entry goes back to its own bone, not to a
; remembered pointer that may be stale (then that piece would be drawn from freed memory: missing or frozen). Logged in
; "body left to the engine (C23 skin restore: ...)". 0 = the old remembered-pointer restore only. Live.
bSkinRestoreLiveBones=1

[ROCK]
; ROCK-flat (ROCK.dll, the FO4VR physics hands mod, built for flat 1.11.240 from G:/Fallout4ToVR/rock-flat; analysis/rock-flat.md).
; Only matters when ROCK.dll is in Data/F4SE/Plugins (it needs FRIK.dll). Read by fo4flatvr (bInputClaims) and by ROCK.dll.
; 0 = ROCK.dll stays dormant (no hooks, no patches, no FRIK frame callbacks); read once when it loads.
bEnable=1
; Input claims (bridge v8): ROCK takes controller inputs per hand (grip to grab, ...) and fo4flatvr then keeps them from the
; game, the gestures and the button glyphs - in gameplay only; menus, the wrist Pip-Boy, dialogue, VATS, workshop and
; lockpicking keep every input. A claim made while the button is held never fires the button's tap (no reload from a grip
; release); a button still held when the claim ends stays silent until released. Live. 0 = claims ignored (ROCK's grip then
; also reloads / throws as without ROCK). Pipe: bindings claims [on|off].
bInputClaims=1
; ROCK's hands grab, pull, catch and throw objects with the grip. 0 = no new grab starts (an object already held stays until
; its grip is released) and ROCK no longer claims the grip, so it does what it does without ROCK. Live (read by ROCK.dll).
bGrab=1
; ROCK's weapon features on flat: weapon collision, two-handed support grip (a full-authority grip moves the gun you see),
; the weapon-held hand switch (grip the handle with the other hand, let go: that hand fires) and the authored grip below.
; 0 = ROCK sees no first-person weapon. Live (read by ROCK.dll).
bWeapons=1
; ROCK aligns the held gun to the weapon animation's own grip every frame (position only, the controller aim stays; as on
; FO4VR). 0 = the gun stays where the floating gun / FRIK put it; the hand switch keeps working. Live (read by ROCK.dll).
bWeaponGripAlign=1
; The floating gun's kick goes through FRIK's recoil controllers (FO4VR's kickback-node contract): while ROCK holds the
; gun (two-handed, left-hand carry, grip alignment) ROCK applies the kick to the hand carrying it, and ROCK's own recoil
; settings ([DeveloperControls] EmergencyDisableRecoil in ROCK.toml) can drop it. 0 = the floating gun always kicks on its
; own (ROCK's pose then overwrites the kick while it holds the gun). Live (read by fo4flatvr).
bRecoilControl=1
; Physical melee (FO4VR): swing the held weapon (gun bash too) or the bare hand into an actor faster than the speed
; below and the game's own melee hit lands on that actor (damage, perks, stagger, AP, sounds). 0 = only the game's button
; melee. Speeds: iMeleeLinearSpeed in game units per second (FO4VR fMeleeLinearVelocityThreshold 200), iMeleeAngularSpeed-
; DeciRad in 0.1 rad/s (FO4VR fMeleeAngularVelocityThreshold 1.0 = 10). Live (read by ROCK.dll).
bPhysicalMelee=1
iMeleeLinearSpeed=200
iMeleeAngularSpeedDeciRad=10
; FO4VR has no button swing for a drawn melee weapon or fists: ROCK takes that hand's trigger, which then only marks a
; power attack (hold it while swinging). 0 = the trigger keeps the game's own swing. Live (read by ROCK.dll).
bMeleeTriggerClaim=1
; Hand equip (FO4VR ROCK): grab a gun lying in the world and pull that hand's trigger (or let it settle in the grip zone with
; Auto Equip): it becomes your equipped weapon, picked up and equipped without the pick-up / equip sounds. 0 = it stays a
; loose object. Live (read by ROCK.dll).
bHandEquip=1
; A gun equipped from the LEFT hand that way stays in the left hand as the firing hand (FO4VR: the weapon stays in the hand
; that equipped it; ROCK's left firing carry, as the hand switch). 0 = it goes to the right hand. Live (read by ROCK.dll).
bHandEquipLeftFiring=1
; Gun at walls: ROCK's weapon collision keeps the held gun's aim in contact, so a gun pushed into a wall slides back along
; its aim instead of twisting sideways (ROCK's softened contact response let the grip's pull buckle it 40-98 deg).
; 0 = ROCK's own contact response. Live (read by ROCK.dll).
bWeaponContactKeepAim=1
; Left-handed mode ([Controllers] bLeftHanded=1): ROCK's default firing hand follows it (FO4VR left-handed with ROCK =
; FiringHand.DefaultHand=left): the gun fires from the left trigger, the grenade quick-draw goes to the free right hand,
; the right trigger stays the Pip-Boy's; the hand switch works from the left (right hand grips the handle, left lets go).
; 0 = ROCK's own DefaultHand setting. Live (read by ROCK.dll).
bFollowLeftHanded=1
; Grenade quick-draw (FO4VR with ROCK): in gameplay ROCK takes the primary B button; a tap still opens V.A.T.S., a hold
; draws a grenade into the hand to throw physically. The primary-grip-hold grenade throw is unchanged. 0 = B is V.A.T.S. only.
; Live (read by ROCK.dll).
bGrenadeQuickDraw=1
; ROCK-flat diagnostic lines in ROCK.log (grip press, support squeeze, release velocity, hand-switch zone, input, frame
; time every 10 s). 0 = off. Live (read by ROCK.dll).
bDiagLog=0

[ConfigUI]
; 20 Nov: the VR settings panel (plugin ConfigUI.h, analysis/vr-config-ui.md): a world-locked panel in front of you with the
; settings below (Quick, Camera, Comfort, Render, Height, Gestures, Selfie, FRIK, Keys), pointed at with either controller
; (trigger = click, stick up/down = scroll, stick left/right = change the value under the ray, B / Y = close). Open / close:
; hold the left menu button fMenuHoldS (a tap still opens Pause, on release), the gesture action "VR settings panel"
; (default: right stick click + hand up, then down), or [Keys] iConfigMenu (Ctrl+F2). A change shows at once (live rows) or
; is marked "(restart)"; Save writes MCM's Data\MCM\Settings\fo4flatvr.ini (through MCM while it is loaded), never this
; file. Changes made in MCM or in this file are picked up within a second.
; 0 = no panel, and the left menu button is Pause on press as before. Live.
; 20 Nov (live settings): almost every key of this file now applies while the game runs (each module re-reads its keys when
; the merged settings change); the ones that need a restart are listed with the reason in analysis/vr-config-ui.md section 9,
; marked "(restart)" in the panel, and named in the log ("applies after a restart") when they change.
bEnabled=1
; 0 = the left menu button does not open the panel (Pause on press as before)
bMenuHold=0
fMenuHoldS=1.0
; panel placement when it opens: metres ahead of the head, width, centre height relative to eye level
fDistanceM=0.7
fWidthM=0.9
fHeightM=-0.12
; haptic ticks on hover / click / value steps
bHaptics=1

[Gestures]
; VRIK-style gestures (16 Nov; plugin Gestures.h, analysis/vr-gestures.md). Normally set in MCM ("VR (fo4flatvr)"): MCM's
; Data\MCM\Settings\fo4flatvr.ini overrides this section and is re-read within a second of a change (no restart).
; Hold a stick click, move the hand, release: 13 gestures per hand in VRIK's order (Tap, Up, Down, Left, Right, Back, Fwd,
; UpDown, DownUp, LeftRight, RightLeft, BackFwd, FwdBack). i<L|R><Gesture>Action: 0 none (default), 1 key press
; (i<L|R><Gesture>Key = index in the MCM key list, i<L|R><Gesture>Mod 0 none / 1 Shift / 2 Ctrl / 3 Alt), 2 recentre,
; 3 first/third person, 4 camera view cycle, 5 the VR settings panel (default on iRUpDownAction). The right stick click alone no longer opens the favourites menu.
; 0 = no gestures at all (sticks as before; the right click still does not open favourites).
bEnabled=1
bRightHand=1
; left stick click = sprint: with left gestures on, sprint starts after fButtonDelayS held still (VRIK button delay)
bLeftHand=0
fMoveCm=11.0
fDominance=1.5
fMaxHoldS=2.0
fCooldownS=0.3
fButtonDelayS=0.5
fKeyHoldMs=100.0
; 1 = gestures work everywhere: every camera view (CINEMA, third person, SCENE ...), menus, Pip-Boy, dialogue,
; VATS and workshop (20 Nov); only first/third person and the view cycle wait while a load or the main menu is up;
; 0 = only in the first-person world view (before 20 Nov)
bAllViews=1
bHaptics=1
fHapticAmp=0.5
fHapticS=0.06

[Selfie]
; VRIK selfie mode on FRIK-flat's mirror body (needs [FRIK] bBody=1 and FRIK.dll): raise the hands fHandsUpCm above the
; headset for fHoldS to toggle; while they stay up the body stands fDistanceM in front of you and the wrist roll turns it.
; Ends on the same gesture, any menu, or a camera other than first person. Also in MCM.
bEnabled=1
; 0 off hand, 1 main hand, 2 both hands (VRIK selfieModeHands)
iHands=2
fHandsUpCm=25.0
fHoldS=0.5
